<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LED Card Animator</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d;
    --text: #e6edf3; --muted: #8b949e; --accent: #2f81f7;
    --good: #3fb950; --bad: #f85149;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); padding: 24px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: 13px; }
  .wrap { max-width: 920px; margin: 0 auto; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; }
  .panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px; flex: 1; min-width: 280px;
  }
  .panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em;
    color: var(--muted); margin: 0 0 12px; }
  button {
    background: #21262d; color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 14px; cursor: pointer; font-size: 13px;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger  { border-color: var(--bad); color: var(--bad); }
  .anim-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .anim-grid button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 4px; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  input[type=color] { width: 48px; height: 32px; padding: 0; border: 1px solid var(--border);
    border-radius: 6px; background: none; cursor: pointer; vertical-align: middle; }
  .val { color: var(--text); font-variant-numeric: tabular-nums; }
  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--bad); }
  .dot.on { background: var(--good); }
  canvas { width: 100%; height: 56px; display: block; background: #000;
    border: 1px solid var(--border); border-radius: 8px; margin-top: 4px; }
  #log { background: #010409; border: 1px solid var(--border); border-radius: 8px;
    padding: 10px; height: 120px; overflow-y: auto; font-family: ui-monospace, monospace;
    font-size: 12px; color: var(--muted); white-space: pre-wrap; }
  .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  .spacer { flex: 1; }
  code { background: #21262d; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🪶 LED Card Animator</h1>
  <p class="sub">Web Bluetooth controller for the Faroe LED-card GATT service
     (<code>fa700002-…</code>) — 24× APA102 DotStar strip.</p>

  <div class="toolbar">
    <button id="connect" class="primary">Connect</button>
    <button id="disconnect" disabled>Disconnect</button>
    <label style="margin:0; display:inline-flex; align-items:center; gap:5px; color:var(--text)">
      <input type="checkbox" id="showAll" /> Show all devices
    </label>
    <label style="margin:0; display:inline-flex; align-items:center; gap:5px; color:var(--text)"
           title="Write-with-response self-paces to the link and can't overflow the OS BLE buffer. Uncheck for faster (write-without-response) at the risk of stalls.">
      <input type="checkbox" id="reliable" checked /> Reliable writes
    </label>
    <span class="status"><span id="dot" class="dot"></span><span id="statusText">Disconnected</span></span>
    <span class="spacer"></span>
    <button id="play" disabled>▶ Play</button>
    <button id="stop" disabled>■ Stop</button>
    <button id="clear" class="danger" disabled>Blank</button>
  </div>

  <canvas id="preview" width="720" height="56" title="Live preview"></canvas>
  <p id="hint" class="sub" style="display:none; margin:6px 0 0">
    🖌 <b>Paint mode</b> — click or drag pixels to set them to the base color.
    Hold <code>Shift</code> or right-click to erase. <b>Blank</b> clears the canvas.
  </p>

  <div class="row" style="margin-top:16px">
    <div class="panel">
      <h2>Animation</h2>
      <div id="animGrid" class="anim-grid"></div>
    </div>

    <div class="panel" style="flex:0 0 280px">
      <h2>Parameters</h2>
      <label>Base color</label>
      <input type="color" id="color" value="#00ccff" />

      <label>Brightness <span class="val" id="briVal">8</span> / 10</label>
      <input type="range" id="brightness" min="0" max="10" value="8" />

      <label>Speed <span class="val" id="speedVal">1.0</span>×</label>
      <input type="range" id="speed" min="1" max="40" value="10" />

      <label>Send interval <span class="val" id="rateVal">80</span> ms</label>
      <input type="range" id="rate" min="30" max="300" value="80" />
    </div>
  </div>

  <div class="panel" style="margin-top:16px">
    <h2>Log</h2>
    <div id="log"></div>
  </div>
</div>

<script>
// ─── GATT protocol (mirrors apps/nightengale-main/src/led_card.rs) ──────────
const SERVICE_UUID = 'fa700002-0000-0000-0000-000000000000';
const CONFIG_UUID  = 'fa700002-0001-0000-0000-000000000000';
const WRITE_UUID   = 'fa700002-0002-0000-0000-000000000000';

const CMD_BLANK = 0, CMD_WRITE = 1, CMD_FLUSH = 2, CMD_WRITE_FLUSH = 3;
const LED_COUNT = 24;
// Keep every write ≤ 18 B so it fits even the BLE-minimum ATT MTU of 23
// (max write = MTU − 3 = 20 B). 3 header bytes + 5 RGB triples = 18 B.
// The firmware offers MTU 27, but the central (e.g. Chrome+BlueZ on Linux)
// often doesn't negotiate up, and a 24 B write then fails as "GATT operation
// failed for unknown reason" before it ever reaches the device.
const PX_PER_CHUNK = 5;

// ─── State ──────────────────────────────────────────────────────────────────
let device = null, writeChar = null, configChar = null, writeNoResp = true;
let playing = false, raf = 0, lastSend = 0, sending = false, animState = {};
let currentAnim = 'rainbow';
const px = Array.from({ length: LED_COUNT }, () => [0, 0, 0]);
// Persistent canvas for Paint mode — survives play/stop and animation switches.
const paintBuf = Array.from({ length: LED_COUNT }, () => [0, 0, 0]);

const $ = (id) => document.getElementById(id);
function log(msg) {
  const el = $('log');
  el.textContent += msg + '\n';
  el.scrollTop = el.scrollHeight;
}

// ─── Color helpers ────────────────────────────────────────────────────────
function hexToRgb(hex) {
  return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
}
function hsv(h, s, v) { // h,s,v ∈ [0,1]
  h = (h % 1 + 1) % 1;
  const i = Math.floor(h * 6), f = h * 6 - i;
  const p = v * (1 - s), q = v * (1 - f * s), t = v * (1 - (1 - f) * s);
  const [r, g, b] = [[v, t, p], [q, v, p], [p, v, t], [p, q, v], [t, p, v], [v, p, q]][i % 6];
  return [Math.round(r * 255), Math.round(g * 255), Math.round(b * 255)];
}
const scale = (c, f) => [Math.round(c[0] * f), Math.round(c[1] * f), Math.round(c[2] * f)];
const clearPx = () => { for (let i = 0; i < LED_COUNT; i++) px[i] = [0, 0, 0]; };

// ─── Animations: render(t, color, speed, state) mutates the shared px[] ─────
const ANIMATIONS = {
  paint: { label: '🖌 Paint', paint: true,
    render() { for (let i = 0; i < LED_COUNT; i++) px[i] = [...paintBuf[i]]; } },

  off: { label: 'Off', render() { clearPx(); } },

  solid: { label: 'Solid', render(t, c) { for (let i = 0; i < LED_COUNT; i++) px[i] = [...c]; } },

  rainbow: { label: 'Rainbow', render(t, c, sp) {
    for (let i = 0; i < LED_COUNT; i++) px[i] = hsv(i / LED_COUNT + t * sp * 0.15, 1, 1);
  } },

  comet: { label: 'Comet', render(t, c, sp) {
    const tail = 7, head = (t * sp * 7) % LED_COUNT;
    for (let i = 0; i < LED_COUNT; i++) {
      const d = (head - i + LED_COUNT) % LED_COUNT;
      px[i] = d < tail ? scale(c, 1 - d / tail) : [0, 0, 0];
    }
  } },

  cylon: { label: 'Cylon', render(t, c, sp) {
    const w = 4, ph = (t * sp * 0.6) % 2, p = ph < 1 ? ph : 2 - ph, head = p * (LED_COUNT - 1);
    for (let i = 0; i < LED_COUNT; i++) {
      const d = Math.abs(i - head);
      px[i] = d < w ? scale(c, 1 - d / w) : [0, 0, 0];
    }
  } },

  theater: { label: 'Theater', render(t, c, sp) {
    const off = Math.floor(t * sp * 5) % 3;
    for (let i = 0; i < LED_COUNT; i++) px[i] = (i % 3) === off ? [...c] : [0, 0, 0];
  } },

  wipe: { label: 'Color Wipe', render(t, c, sp) {
    const step = Math.floor(t * sp * 10) % (LED_COUNT * 2);
    for (let i = 0; i < LED_COUNT; i++) {
      const on = step < LED_COUNT ? i <= step : i > step - LED_COUNT;
      px[i] = on ? [...c] : [0, 0, 0];
    }
  } },

  breathe: { label: 'Breathe', render(t, c, sp) {
    let f = Math.sin(t * sp * 1.5) * 0.5 + 0.5; f *= f;
    const s = scale(c, f);
    for (let i = 0; i < LED_COUNT; i++) px[i] = [...s];
  } },

  twinkle: { label: 'Twinkle', render(t, c, sp, st) {
    if (!st.lvl) st.lvl = new Float32Array(LED_COUNT);
    const spawn = 0.04 * sp;
    for (let i = 0; i < LED_COUNT; i++) {
      st.lvl[i] *= 0.88;
      if (Math.random() < spawn) st.lvl[i] = 1;
      px[i] = scale(c, st.lvl[i]);
    }
  } },

  fire: { label: 'Fire', render(t, c, sp, st) {
    if (!st.heat) st.heat = new Float32Array(LED_COUNT);
    for (let i = 0; i < LED_COUNT; i++) {
      st.heat[i] = Math.max(0, st.heat[i] - Math.random() * 0.12 * sp);
      if (Math.random() < 0.25 * sp) st.heat[i] = Math.min(1, st.heat[i] + Math.random() * 0.6);
      const h = st.heat[i];
      px[i] = [Math.round(255 * h), Math.round(90 * h * h), Math.round(10 * h * h * h)];
    }
  } },
};

// ─── BLE write path ─────────────────────────────────────────────────────────
async function writeBytes(bytes) {
  const buf = new Uint8Array(bytes);
  if (writeNoResp && writeChar.writeValueWithoutResponse) {
    await writeChar.writeValueWithoutResponse(buf);
  } else if (writeChar.writeValueWithResponse) {
    await writeChar.writeValueWithResponse(buf);
  } else {
    await writeChar.writeValue(buf); // legacy fallback
  }
}

// Set to true once a full-frame write is rejected (link MTU too small),
// so we stop retrying it and stick to chunked writes for the session.
let forceChunked = false;

// Paint the whole strip. Fast path: one WRITE_FLUSH carrying all 24 pixels
// (needs ATT MTU ≥ 78 — the firmware offers mtu-128). Fallback: chunked
// WRITE commands + a FLUSH, which fits even the 23-byte minimum MTU.
async function sendFrame(brightness) {
  if (!forceChunked) {
    const b = new Uint8Array(3 + LED_COUNT * 3); // [WRITE_FLUSH, 0, bri, RGB×24] = 75 B
    b[0] = CMD_WRITE_FLUSH; b[1] = 0; b[2] = brightness;
    for (let i = 0; i < LED_COUNT; i++) {
      const p = px[i];
      b[3 + i * 3] = p[0]; b[4 + i * 3] = p[1]; b[5 + i * 3] = p[2];
    }
    try {
      await writeBytes(b);
      return; // one write per frame — the fast path
    } catch (e) {
      // Almost certainly the value exceeded the negotiated ATT MTU.
      forceChunked = true;
      log('full-frame write rejected (low MTU); using chunked writes: ' + e.message);
    }
  }

  // Chunked fallback: ≤5 px per WRITE (18 B, fits MTU 23) then a FLUSH.
  for (let i = 0; i < LED_COUNT; i += PX_PER_CHUNK) {
    const count = Math.min(PX_PER_CHUNK, LED_COUNT - i);
    const b = new Uint8Array(3 + count * 3);
    b[0] = CMD_WRITE; b[1] = i; b[2] = brightness;
    for (let j = 0; j < count; j++) {
      const p = px[i + j];
      b[3 + j * 3] = p[0]; b[4 + j * 3] = p[1]; b[5 + j * 3] = p[2];
    }
    await writeBytes(b);
  }
  await writeBytes([CMD_FLUSH]);
}

// ─── Render loop (preview always; BLE throttled by send interval) ───────────
function tick(now) {
  if (!playing) return;
  const t = now / 1000;
  const color = hexToRgb($('color').value);
  const speed = (+$('speed').value) / 10;
  const rate = +$('rate').value;

  ANIMATIONS[currentAnim].render(t, color, speed, animState);
  drawPreview();

  const connected = device && device.gatt && device.gatt.connected && writeChar;
  if (connected && !sending && now - lastSend >= rate) {
    lastSend = now; sending = true;
    sendFrame(+$('brightness').value)
      .catch((e) => log('⚠ write failed: ' + e.message))
      .finally(() => { sending = false; });
  }
  raf = requestAnimationFrame(tick);
}

function startLoop() {
  if (playing) return;
  animState = {};
  playing = true;
  $('play').disabled = true; $('stop').disabled = false;
  raf = requestAnimationFrame(tick);
}
function stopLoop() {
  playing = false; cancelAnimationFrame(raf);
  $('play').disabled = !(device && device.gatt.connected); $('stop').disabled = true;
}

// ─── Preview canvas ──────────────────────────────────────────────────────────
const ctx = $('preview').getContext('2d');
function drawPreview() {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  const bri = (+$('brightness').value) / 10;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const r = 11, gap = W / LED_COUNT;
  for (let i = 0; i < LED_COUNT; i++) {
    const [pr, pg, pb] = scale(px[i], bri);
    const x = gap * (i + 0.5), y = H / 2;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = `rgb(${pr},${pg},${pb})`; ctx.fill();
    if (pr + pg + pb > 30) {
      ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 14; ctx.fill(); ctx.shadowBlur = 0;
    }
  }
}

// ─── Paint mode: click / drag pixels in the preview canvas ──────────────────
const canvas = ctx.canvas;
let painting = false;

function pixelAt(ev) {
  const rect = canvas.getBoundingClientRect();
  const x = (ev.clientX - rect.left) / rect.width * canvas.width; // → internal coords
  const i = Math.floor(x / (canvas.width / LED_COUNT));
  return Math.max(0, Math.min(LED_COUNT - 1, i));
}
function applyPaint(ev) {
  // Right button or Shift erases; left button paints the base color.
  const erase = ev.shiftKey || (ev.buttons & 2) || ev.button === 2;
  paintBuf[pixelAt(ev)] = erase ? [0, 0, 0] : hexToRgb($('color').value);
  drawPreview();
}
canvas.addEventListener('pointerdown', (e) => {
  if (currentAnim !== 'paint') return;
  painting = true; canvas.setPointerCapture(e.pointerId); applyPaint(e);
});
canvas.addEventListener('pointermove', (e) => { if (painting) applyPaint(e); });
canvas.addEventListener('pointerup', () => { painting = false; });
canvas.addEventListener('contextmenu', (e) => { if (currentAnim === 'paint') e.preventDefault(); });

// ─── Connection ──────────────────────────────────────────────────────────────
async function connect() {
  if (!navigator.bluetooth) {
    log('✗ Web Bluetooth unavailable. Use Chrome/Edge over https or http://localhost.');
    return;
  }
  try {
    // The board advertises its name ("LED Card") but NOT the service UUID,
    // so we can only filter by name — and name filtering is flaky on some
    // platforms (notably Chrome+BlueZ on Linux). "Show all devices" falls back
    // to acceptAllDevices, which lists every advertiser so you can pick it
    // manually; the service is still reachable because it's in optionalServices.
    const opts = $('showAll').checked
      ? { acceptAllDevices: true, optionalServices: [SERVICE_UUID] }
      : { filters: [{ namePrefix: 'LED' }], optionalServices: [SERVICE_UUID] };
    log('Requesting device… (' + ($('showAll').checked ? 'all devices' : 'name filter') + ')');
    device = await navigator.bluetooth.requestDevice(opts);
    device.addEventListener('gattserverdisconnected', onDisconnected);
    log('Connecting to ' + device.name + '…');
    const server = await device.gatt.connect();
    const svc = await server.getPrimaryService(SERVICE_UUID);
    writeChar = await svc.getCharacteristic(WRITE_UUID);
    try { configChar = await svc.getCharacteristic(CONFIG_UUID); } catch { configChar = null; }
    // "Reliable writes" forces write-with-response, which self-paces to the
    // link and can't overflow the OS BLE buffer. Without it we use
    // write-without-response (faster, but can stall under sustained traffic).
    writeNoResp = writeChar.properties.writeWithoutResponse && !$('reliable').checked;
    forceChunked = false; // re-probe full-frame writes on this connection
    setConnected(true);
    log('✓ Connected. Write mode: ' + (writeNoResp ? 'no-response' : 'with-response'));
  } catch (e) {
    if (e.name === 'NotFoundError') {
      // Either the user dismissed the chooser, or nothing matched the filter.
      log('✗ No device selected/found. If the board is powered & advertising '
        + 'but not listed, tick “Show all devices” and try again. Also confirm '
        + 'it isn’t already connected elsewhere (a connected board stops advertising).');
    } else {
      log('✗ ' + e.name + ': ' + e.message);
    }
  }
}

function disconnect() {
  if (device && device.gatt.connected) device.gatt.disconnect();
}
function onDisconnected() {
  log('Device disconnected.');
  setConnected(false);
}
function setConnected(on) {
  $('dot').classList.toggle('on', on);
  $('statusText').textContent = on ? ('Connected — ' + device.name) : 'Disconnected';
  $('connect').disabled = on; $('disconnect').disabled = !on;
  $('play').disabled = !on || playing; $('clear').disabled = !on;
  if (!on) { writeChar = null; stopLoop(); }
}

// Blank: clear + flush ([BLANK, 1]); also enters manual mode on the device.
async function blank() {
  for (let i = 0; i < LED_COUNT; i++) paintBuf[i] = [0, 0, 0]; // also reset Paint canvas
  try { await writeBytes([CMD_BLANK, 1]); clearPx(); drawPreview(); log('Strip blanked.'); }
  catch (e) { log('⚠ blank failed: ' + e.message); }
}

// ─── UI wiring ───────────────────────────────────────────────────────────────
function selectAnim(key) {
  currentAnim = key; animState = {};
  [...$('animGrid').children].forEach((c) => c.classList.toggle('active', c.dataset.key === key));
  const isPaint = !!ANIMATIONS[key].paint;
  canvas.style.cursor = isPaint ? 'crosshair' : 'default';
  $('hint').style.display = isPaint ? 'block' : 'none';
  drawPreview();
  // In Paint mode, keep streaming so the canvas latches and the device
  // stays in manual control (it auto-resumes its chaser ~30 s after the
  // last write). Needs a live connection to start the loop.
  if (isPaint && device && device.gatt.connected) startLoop();
}

function buildAnimGrid() {
  const grid = $('animGrid');
  for (const [key, a] of Object.entries(ANIMATIONS)) {
    const btn = document.createElement('button');
    btn.textContent = a.label; btn.dataset.key = key;
    btn.classList.toggle('active', key === currentAnim);
    btn.onclick = () => selectAnim(key);
    grid.appendChild(btn);
  }
}

$('connect').onclick = connect;
$('disconnect').onclick = disconnect;
$('play').onclick = startLoop;
$('stop').onclick = stopLoop;
$('clear').onclick = blank;
$('brightness').oninput = (e) => { $('briVal').textContent = e.target.value; drawPreview(); };
$('speed').oninput = (e) => { $('speedVal').textContent = (e.target.value / 10).toFixed(1); };
$('rate').oninput = (e) => { $('rateVal').textContent = e.target.value; };

buildAnimGrid();
drawPreview();
log('Ready. Click Connect and pick "LED Card".');
</script>
</body>
</html>
